plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}
version = mod_version
group = 'com.raishxn.gtoa'
base { archivesName = 'gto-additions' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
legacyForge {
    version = '1.20.1-47.4.20'
    mods { gtoa { sourceSet sourceSets.main } }
}
repositories {
    flatDir { dirs 'libs' }
    mavenCentral()
    maven { url = 'https://maven.gtodyssey.com/releases' }
}
dependencies {
    modCompileOnly 'dev:gtocore:26.9.5'
    modCompileOnly 'dev:gtceu:26.9.70'
    modCompileOnly 'dev:ldlib:1.0.52.a'
    modCompileOnly 'dev:datasynclib:26.9.4'
    modCompileOnly 'dev:ae2:15.269.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.openjdk.nashorn:nashorn-core:15.4'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}

tasks.named('test') { useJUnitPlatform() }

tasks.named('jar') {
    from(project.files('LICENSE', 'COPYING', 'THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
}
